[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webcquisition"
dynamic = ["version"]
description = "Acquisizione forense automatizzata di attività web in una VM Windows su VMware Workstation Pro"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "WEBCQUISITION contributors" }]
keywords = ["digital forensics", "web acquisition", "vmware", "pcapng", "sslkeylogfile", "wireshark", "dfir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
# Host: solo PyYAML. Agent e modulo comune: solo libreria standard.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
webcquisition = "webcquisition.cli:main"
webcquisition-agent = "webcquisition_agent.__main__:main"

[project.urls]
Documentation = "https://github.com/webcquisition/WEBCQUISITION/tree/main/docs"
Issues = "https://github.com/webcquisition/WEBCQUISITION/issues"

[tool.setuptools.dynamic]
version = { attr = "webcquisition_common.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webcquisition = ["assets/*.ps1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
